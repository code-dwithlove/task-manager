spring.application.name=taskmanager
server.port=${PORT:8080}

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/taskmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ai.base-url=https://generativelanguage.googleapis.com/v1beta